defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # Use the third physical GPU on the shared five-GPU host.
    actor: 2-2

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf-nero
    experiment_name: "nero_right_rlt_stage1_sft_openpi_pi05"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 2000
  val_check_interval: -1
  save_interval: 500

data:
  train_data_paths: ${oc.env:NERO_RIGHT_DATASET}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 16
  seed: 42

  model:
    model_type: "openpi_rlinf"
    precision: fp32
    is_lora: False
    model_path: ${oc.env:NERO_PI05_CHECKPOINT}
    num_action_chunks: 50
    action_dim: 8
    add_value_head: False
    num_steps: 5
    openpi_data:
      repo_id: ${oc.env:NERO_RIGHT_DATASET}
      norm_stats_path: ${oc.env:NERO_RIGHT_DATASET}
      wrist_dropout_prob: 0.1
      state_dropout_prob: 0.1
    openpi:
      task: sft
      config_name: "pi05_nero_right"
      num_images_in_input: 2
      train_expert_only: True
      action_horizon: ${actor.model.num_action_chunks}
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      model_action_dim: 32
      num_steps: ${actor.model.num_steps}
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True
      use_rlt: True
      rlt_alpha: 1.0
      rlt_prefix_seq_len: 768
      rlt_image_only: False
      rlt_use_mask: True

  optim:
    lr: 1e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 100
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    # Gemma blocks contain both frozen VLM and trainable action-expert parameters.
    use_orig_params: True
    # Keep activation memory within one RTX 4090 while micro-batch stays at 1.
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
